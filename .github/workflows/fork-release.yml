name: Fork Release

# Syncs main with pingdotgg/t3code, merges the branches listed in features.txt
# on top, and publishes a nightly-versioned GitHub release that fork desktop
# installs update from. Upstream's CI has already tested main, so this only
# proves the overlay merges and typechecks, then packages it with upstream's
# own release-desktop.yml, called from main so the build steps never fork.

on:
  schedule:
    # Daily. Skips the build when main and every feature branch are unchanged
    # since the last release.
    - cron: "17 9 * * *"
  # A manual run always builds.
  workflow_dispatch:

concurrency:
  group: fork-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    name: Sync and overlay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
    outputs:
      build: ${{ steps.decide.outputs.build }}
      version: ${{ steps.decide.outputs.version }}
      fingerprint: ${{ steps.decide.outputs.fingerprint }}
      inputs: ${{ steps.overlay.outputs.inputs }}
      ref: ${{ steps.push.outputs.ref }}
    env:
      # GITHUB_TOKEN cannot push commits that touch .github/workflows, and most
      # upstream syncs do, so syncing needs a fine-grained token for this
      # repository with Contents and Workflows read/write.
      GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
      REPO: ${{ github.repository }}
    steps:
      # Refuses to run if main has commits upstream lacks, which keeps main a
      # pure mirror.
      - name: Sync main with upstream
        run: gh repo sync "$REPO" --branch main

      # Upstream's workflows target Blacksmith runners and upstream's
      # infrastructure. A disabled workflow stays disabled across syncs, but one
      # upstream adds later starts enabled, so everything else is switched off.
      - name: Disable upstream workflows
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: .github/workflows/fork-release.yml .github/workflows/release-desktop.yml
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/workflows?per_page=100" \
            --jq '.workflows[] | select(.state == "active") | "\(.id) \(.path)"' |
            while read -r id path; do
              [[ "$path" == .github/workflows/* ]] || continue
              [[ " $KEEP " == *" $path "* ]] && continue
              echo "Disabling $path"
              gh workflow disable "$id" -R "$REPO"
              gh run list -R "$REPO" -w "$id" --json databaseId,status \
                -q '.[] | select(.status != "completed") | .databaseId' |
                xargs -r -n1 gh run cancel -R "$REPO" || true
            done

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Merge feature branches
        id: overlay
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh api "repos/$REPO/contents/features.txt?ref=$GITHUB_SHA" \
            -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/features.txt"

          inputs="main@$(git rev-parse HEAD)"
          failed=()
          while read -r branch; do
            if ! sha="$(git rev-parse --verify -q "origin/$branch^{commit}")"; then
              echo "::error::features.txt lists $branch, which does not exist."
              failed+=("$branch")
              continue
            fi
            if git merge --no-ff --no-edit -m "Overlay $branch" "$sha"; then
              inputs+=" $branch@$sha"
            else
              git merge --abort
              echo "::error::$branch conflicts with main plus the branches above it in features.txt. Rebase it onto main."
              failed+=("$branch")
            fi
          done < <(sed -e 's/#.*//' -e 's/[[:space:]]//g' "$RUNNER_TEMP/features.txt" | grep -v '^$' || true)

          if (( ${#failed[@]} > 0 )); then
            exit 1
          fi
          echo "inputs=$inputs" >> "$GITHUB_OUTPUT"

      - name: Decide whether to build
        id: decide
        env:
          INPUTS: ${{ steps.overlay.outputs.inputs }}
        run: |
          set -euo pipefail
          fingerprint="$(printf '%s' "$INPUTS" | sha256sum | cut -c1-16)"
          latest="$(gh release list -R "$REPO" --limit 1 --json tagName -q '.[0].tagName // ""')"
          previous=""
          if [[ -n "$latest" ]]; then
            previous="$(gh release view "$latest" -R "$REPO" --json body -q .body | sed -n 's/.*fork-inputs: \([0-9a-f]*\).*/\1/p')"
          fi
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$fingerprint" == "$previous" ]]; then
            echo "Nothing changed since $latest." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Same scheme as scripts/resolve-nightly-release.ts: the next patch of
          # the desktop version, so the build gets the nightly update channel.
          base="$(node -p "require('./apps/desktop/package.json').version.replace(/[-+].*$/, '')")"
          IFS=. read -r major minor patch <<<"$base"
          version="$major.$minor.$((patch + 1))-nightly.$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER"
          echo "Building $version from: $INPUTS" | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo "build=true"
            echo "version=$version"
            echo "fingerprint=$fingerprint"
          } >> "$GITHUB_OUTPUT"

      # The platform builds fetch the commit from this repository, so the merge
      # result needs a ref. The release tag pins it once published.
      - name: Push build commit
        id: push
        if: steps.decide.outputs.build == 'true'
        run: |
          set -euo pipefail
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:refs/heads/fork-build
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  typecheck:
    name: Typecheck
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - run: vp run --filter @t3tools/desktop ensure:electron

      - run: vp run typecheck

  bundle:
    name: Build JS bundle
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - run: node scripts/update-release-package-versions.ts "${{ needs.prepare.outputs.version }}"

      # The desktop build compiles the Linux browser secret helper.
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      # No T3 Connect (Clerk/relay) config: that belongs to upstream's
      # production deployment, so fork builds ship without T3 Connect.
      - name: Build JS bundle
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
        run: vp run build:desktop

      # release-desktop.yml downloads this into `apps`.
      - uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  # `uses` cannot take an expression, so the repository is spelled out.
  linux_x64:
    name: Linux x64
    needs: [prepare, bundle]
    uses: vineelsai26/v9/.github/workflows/release-desktop.yml@main
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.ref }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      # The Windows build embeds this archive as its WSL runtime and waits for
      # a job whose name ends in "Build Linux x64".
      cli_archive: true

  mac_arm64:
    name: macOS arm64
    needs: [prepare, bundle]
    uses: vineelsai26/v9/.github/workflows/release-desktop.yml@main
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.ref }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: macOS arm64
      runner: macos-15
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: false

  win_x64:
    name: Windows x64
    needs: [prepare, bundle]
    uses: vineelsai26/v9/.github/workflows/release-desktop.yml@main
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.ref }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Windows x64
      runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      cli_archive: false

  publish:
    name: Publish release
    needs: [prepare, typecheck, linux_x64, mac_arm64, win_x64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      # electron-updater finds the release through its `v<version>` tag and the
      # nightly*.yml manifests; the release must be a prerelease for the
      # nightly feed.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REF: ${{ needs.prepare.outputs.ref }}
          INPUTS: ${{ needs.prepare.outputs.inputs }}
          FINGERPRINT: ${{ needs.prepare.outputs.fingerprint }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd release-assets
          rm -f builder-debug.yml
          # release-desktop.yml suffixes Windows manifests per arch for
          # upstream's x64/arm64 merge. With one arch the suffix comes off.
          for manifest in *-win-x64.yml; do
            mv "$manifest" "${manifest%-win-x64.yml}.yml"
          done

          {
            echo "Built from \`$REF\`:"
            echo
            for input in $INPUTS; do
              echo "- \`${input%@*}\` @ ${input##*@}"
            done
            echo
            echo "<!-- fork-inputs: $FINGERPRINT -->"
          } > "$RUNNER_TEMP/notes.md"

          gh release create "v$VERSION" * \
            --repo "$GITHUB_REPOSITORY" \
            --target "$REF" \
            --title "T3 Code (fork) $VERSION" \
            --prerelease \
            --notes-file "$RUNNER_TEMP/notes.md"
